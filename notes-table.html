<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musical Notes</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f7f7f8;
      color: #222;
      margin: 0;
      padding: 2rem;
      display: flex;
      justify-content: center;
    }
    table {
      border-collapse: collapse;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      border-radius: 8px;
      overflow: hidden;
      min-width: 320px;
    }
    caption {
      font-weight: 600;
      font-size: 1.1rem;
      padding: 0.75rem;
      text-align: left;
    }
    th, td {
      padding: 0.6rem 1rem;
      text-align: left;
      border-bottom: 1px solid #e5e5e5;
    }
    th {
      background: #2b2b2b;
      color: #fff;
      font-weight: 600;
    }
    tbody tr:nth-child(even) { background: #fafafa; }
    tbody tr:last-child td { border-bottom: none; }
    .num { color: #888; width: 2rem; }
    .accidental { color: #555; }
  </style>
</head>
<body>
  <table>
    <caption>Chromatic Scale (12 Notes)</caption>
    <thead>
      <tr>
        <th class="num">#</th>
        <th>Note</th>
      </tr>
    </thead>
    <tbody>
      <tr><td class="num">1</td><td>A</td></tr>
      <tr><td class="num">2</td><td class="accidental">A# / Bb</td></tr>
      <tr><td class="num">3</td><td>B</td></tr>
      <tr><td class="num">4</td><td>C</td></tr>
      <tr><td class="num">5</td><td class="accidental">C# / Db</td></tr>
      <tr><td class="num">6</td><td>D</td></tr>
      <tr><td class="num">7</td><td class="accidental">D# / Eb</td></tr>
      <tr><td class="num">8</td><td>E</td></tr>
      <tr><td class="num">9</td><td>F</td></tr>
      <tr><td class="num">10</td><td class="accidental">F# / Gb</td></tr>
      <tr><td class="num">11</td><td>G</td></tr>
      <tr><td class="num">12</td><td class="accidental">G# / Ab</td></tr>
      <tr><td class="num">13</td><td>A <span class="accidental">(octave)</span></td></tr>
    </tbody>
  </table>
</body>
</html>
